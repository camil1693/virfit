<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="t">
  <title id="t">VirFit: rayo azul que sale de un puño cerrado</title>
  <!-- Fondo: círculo negro (Instagram recorta la foto de perfil en círculo) -->
  <circle cx="128" cy="128" r="128" fill="#000"/>
  <circle cx="128" cy="128" r="121" fill="none" stroke="#1212ff" stroke-opacity=".35" stroke-width="2"/>
  <!-- Resplandor eléctrico detrás del símbolo -->
  <ellipse cx="128" cy="128" rx="46" ry="100" fill="#1212ff" opacity=".18"/>
  <!-- Símbolo: puño cerrado arriba, rayo que se estrecha hasta la punta -->
  <g transform="translate(92 36) scale(1.2)">
    <!-- Rayo -->
    <path fill="#1212ff" d="M7 38 L53 38 L38 76 L60 76 L22 150 L31 94 L5 94 Z"/>
    <path fill="#5c5cff" d="M7 38 L17 38 L16 94 L5 94 Z"/>
    <path fill="#0000b4" d="M38 76 L60 76 L50 95 L44 95 Z"/>
    <!-- Puño -->
    <rect x="6" y="14" width="48" height="26" rx="9" fill="#2b2bff"/>
    <rect x="6.5" y="2" width="11" height="24" rx="5.5" fill="#3d3dff"/>
    <rect x="18.5" y="2" width="11" height="24" rx="5.5" fill="#3d3dff"/>
    <rect x="30.5" y="2" width="11" height="24" rx="5.5" fill="#3d3dff"/>
    <rect x="42.5" y="2" width="11" height="24" rx="5.5" fill="#3d3dff"/>
    <path d="M18 8v17M30 8v17M42 8v17" stroke="#0a0a8c" stroke-width="1.4" stroke-linecap="round"/>
    <rect x="8.5" y="3.6" width="6" height="3" rx="1.5" fill="#8a8aff" opacity=".85"/>
    <rect x="20.5" y="3.6" width="6" height="3" rx="1.5" fill="#8a8aff" opacity=".85"/>
    <rect x="32.5" y="3.6" width="6" height="3" rx="1.5" fill="#8a8aff" opacity=".85"/>
    <rect x="44.5" y="3.6" width="6" height="3" rx="1.5" fill="#8a8aff" opacity=".85"/>
    <rect x="9" y="26" width="30" height="11" rx="5.5" fill="#1a1ae0" stroke="#0a0a8c" stroke-width="1.2"/>
    <rect x="12" y="28" width="16" height="2.4" rx="1.2" fill="#8a8aff" opacity=".7"/>
  </g>
</svg>
